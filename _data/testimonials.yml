# What Colleagues Say — one entry per person.
# pull:    the single line shown before clicking (keep it to one sentence)
# full:    the whole blurb; leave a blank line between paragraphs
# credits: who they are, shown under the full blurb
# Order here = order on the page.
#
# - name: Full Name
#   credits: "Showrunner, Show Name (Network)"
#   pull: "The one sentence that shows first."
#   full: |
#     First paragraph of the full blurb.
#
#     Second paragraph, if there is one.

- name: "Natalie Chaidez"
  credits: "Writer and producer — Terminator: The Sarah Connor Chronicles, Heroes, The Flight Attendant, Foundation"
  pull: "When I’m stuck on a project, Travis is one of my first calls."
  full: |
    I’m a showrunner and TV producer with 3 decades of experience.  When I’m stuck on a project, Travis is one of my first calls.  His keen sense of character and story, his encyclopedic knowledge of literature and pop culture, and his sense of creative playfulness make him an ideal collaborator.  Plus he’s just a fun hang -- always a pleasure to work with!

- name: "Jose Molina"
  credits: "Firefly, Law & Order: SVU, Star Wars: The Clone Wars, The Burroughs, The Vampire Diaries, Agent Carter, Terra Nova"
  pull: "One of the smartest, most ingenious writers I’ve worked with in my 27-year career."
  full: |
    Travis Fickett is shorter than me, and I love that about him. He’s also one of the smartest, most ingenious writers I’ve worked with in my 27 year career. He’s a tireless idea machine who can also deliver a hell of a draft. Punchy dialogue, deep emotion, unpredictable twists — these are all the hallmarks of Travis’s writing. But remember the short thing. Because that’s important.

- name: "Samuel Chi"
  credits: "Producer and President, 3birds Films"
  pull: "Every time I think I know where a story is headed, Travis opens a door I didn’t know was there."
  full: |
    I first met Travis when he and his writing partner came in to pitch Roy Lee and me a take on MEGAZONE23. I was already a fan of his work on 12 Monkeys, and the pitch showed me why. Travis doesn’t just come up with plot. He builds whole worlds with their own rules, history, and texture, and then lets his characters live in them.

    What sets him apart is that he surprises me. Every time I think I know where a story is headed, Travis opens a door I didn’t know was there. He finds angles and ideas that simply wouldn’t occur to anyone else, and he helps me see my own material in a new light. That is why I’ve kept going back to him, bringing him in to develop several of my sci-fi properties, including ARMITAGE, based on the Japanese anime, and LEVIATHAN, based on the Korean webtoon. Adapting beloved source material takes respect for what fans love and the imagination to expand it, and Travis has both.

    He is also a true collaborator. He listens, builds on other people’s ideas, and makes the room feel creative rather than competitive. On top of the talent, he is a person of real integrity: honest, generous, and easy to work with.

    I recommend Travis without hesitation, and I’ll keep working with him whenever I can.

- name: "Matt Okumura"
  credits: "Writer and producer — Marvel’s Vision Quest, Star Trek: Picard, Interior Chinatown, Into the Badlands, Magic: The Gathering"
  pull: "One of the most collaborative, most inventive and kindest writers I’ve ever met."
  full: |
    I’ve worked with Travis across three years, three seasons of television and too many creative discussions to count. And of all the people I’ve worked with and for over my 25+ year career, he’s one of the most collaborative, most inventive and kindest writers I’ve ever met. And I hate him. Why? He’s a human idea machine, able to attack story from all angles, angles you’d never even think of, angles that’ll shake your core. And if that didn’t enrage me already, his ear for dialogue is enraging. Enraging! His scene work is impeccable, and he can rewrite a scene as good as anyone, or just tell you, “Yeah, cut that. It’s so cheesy, the French are getting jealous.” And the bastard is also hilarious, able to cut the tension in a room with a quip. But most of all, he’s kind. In a business that too often prioritizes, “What can I get out of this?” Travis cares about you as a person first, “How are you doing?” “What’s going on in your life?” “How can I help?” Yes, I’m mad at him. Furious, really. But fine, gun to my head, I have to admit… I’m honored to call him a boss and colleague. I’m even more honored to call him a friend.

- name: "Chris Monfette"
  credits: "Writer and producer — 12 Monkeys, 9-1-1, Vision Quest, Star Trek: Picard"
  pull: "Travis fills his clever, high-concept worlds with heartfelt and intensely human emotion."
  full: |
    Travis offers not only sharp dialogue and deeply human characters but a unique, thoughtful POV on genre storytelling. In an age where the impossibilities of sci-fi and fantasy are becoming increasingly familiar Travis consistently envisions fresh, innovative and often humorous ways to explore these worlds. Be they established franchises or newly imagined, original stories. Collaborative and enthusiastic, Travis is as capable of leading a project as supporting one. Bringing the lived experience of a devoted father and the kid-like imagination of a true genre storyteller, Travis fills his clever, high-concept worlds with heartfelt and intensely human emotion.

- name: "Brent Simons"
  credits: "Megamind, Penguins of Madagascar, Former Jaded Typewriter Monkey"
  pull: "What I’ll see as a roadblock, he’ll see as an opportunity to take my idea to the next level."
  full: |
    I’ve known Travis for over 20 years. (We both used to have hair!) And very early on, I learned, whenever I’m stuck on an idea, to run it past him.

    You see, Travis loves stories - writing them, reading them, talking about them. He even loves those pesky little problems they always present. (Like how nuts is that?) What I’ll see as a roadblock, he’ll see as an opportunity to take my idea to the next level.

    Travis’ years of writing/development is invaluable, but it’s his positivity and infectious excitement that’s a testament to his character. (It’s almost like he doesn’t know all screenwriters are supposed to be jaded typewriter monkeys).

    Writing is a solitary profession, but we all occasionally need that guiding voice to get to the finished draft. Travis will get you there, and get this, you might just actually find this writing thing fun along the way.
