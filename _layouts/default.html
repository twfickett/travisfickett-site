<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title }} &mdash; Travis Fickett</title>
<meta name="description" content="{{ page.description | default: site.description }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root {
    --ink: #15130F; --ink-raised: #1D1A15; --paper: #EDE6D6; --muted: #8B8272;
    --lamp: #D9A544; --serif: 'Fraunces', Georgia, serif;
    --sans: 'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --measure: 640px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--ink); color: var(--paper); font-family: var(--sans); font-size: 17px; line-height: 1.65; -webkit-font-smoothing: antialiased; }
  a { color: var(--lamp); text-decoration: none; border-bottom: 1px solid rgba(217,165,68,0.35); }
  a:hover { border-color: var(--lamp); }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 24px; }
  header { padding: 28px 0 20px; border-bottom: 1px solid rgba(139,130,114,0.18); margin-bottom: 40px; }
  header .wrap { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; }
  .wordmark { font-family: var(--serif); font-weight: 500; font-size: 20px; color: var(--paper); border-bottom: none; }
  nav { display: flex; flex-wrap: wrap; gap: 18px; font-size: 14.5px; }
  nav a { color: var(--muted); border-bottom: 1px solid transparent; }
  nav a:hover { color: var(--lamp); border-color: var(--lamp); }
  .eyebrow { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(28px, 4.4vw, 40px); line-height: 1.25; margin: 0 0 28px; max-width: var(--measure); }
  main p, main ul, main blockquote { max-width: var(--measure); }
  main h2 { font-family: var(--serif); font-weight: 500; font-size: 22px; margin: 40px 0 16px; }
  main blockquote { border-left: 2px solid var(--lamp); margin: 24px 0; padding: 4px 0 4px 20px; color: var(--muted); font-style: italic; }
  footer { padding: 60px 0 60px; color: var(--muted); font-size: 13px; }
  footer a { color: var(--muted); }
  .back-link { display: inline-block; margin-top: 48px; font-size: 15px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="wordmark" href="/" style="border-bottom:none;">Travis Fickett</a>
    <nav>
      <a href="/#work">What I Do</a>
      <a href="/#credits">Credits</a>
      <a href="/#services">Services</a>
      <a href="/#links">Links</a>
      <a href="/#bio">Bio</a>
      <a href="/#contact">Contact</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {% if page.eyebrow %}<p class="eyebrow">{{ page.eyebrow }}</p>{% endif %}
  <h1>{{ page.title }}</h1>

  {{ content }}

  <a class="back-link" href="/">&larr; Back to travisfickett.com</a>
</main>

<footer>
  <div class="wrap">
    <p>&copy; 2026 Travis Fickett</p>
  </div>
</footer>

</body>
</html>
